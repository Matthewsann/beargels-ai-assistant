# 이 파일을 복사해서 config.yaml 로 저장하고 값을 채우세요.  (cp config.example.yaml config.yaml)
# config.yaml 은 깃에 올라가지 않습니다(.gitignore).

naver:
  # 네이버 블로그 아이디 (blog.naver.com/여기부분)
  blog_id: "beargelssongdo"

  # 자동화 전용 크롬 프로필이 저장될 폴더 (한 번 로그인하면 세션이 여기 유지됨).
  # 일상용 크롬과 분리하기 위해 전용 폴더를 씁니다. 처음 그대로 두어도 됩니다.
  profile_dir: "./chrome_profile"

  # true 면 브라우저 창을 띄워서(headful) 동작 — 처음엔 반드시 true 로 두고 눈으로 확인하세요.
  headful: true

  # 임시저장 후 자동으로 '발행'까지 할지 여부.
  # false 를 강력 권장 (발행은 사장님이 사진 확인 후 직접). true 는 위험.
  auto_publish: false

  # (선택) 예약 발행 최종 단계 자동화 수준
  #  assist = 시스템이 글 입력+발행창 열기+'예약' 선택까지, 시간 확인/최종 클릭은 사장님(안정적·기본)
  #  full   = 최종 '예약 발행' 클릭까지 자동 시도 (화면 구조 튜닝 필요할 수 있음)
  # (아래 publish 섹션에서 설정)

# 글 생성(Claude) 설정
generate:
  # 사용할 모델. 블로그 글은 sonnet 으로 충분하고 빠릅니다.
  model: "claude-sonnet-5"
  max_tokens: 5000

# 1단계 자동 적재 설정
stockpile:
  per_run: 3          # 한 번 실행할 때 새로 쌓을 상시 글 개수

# 이미지/영상 설정
images:
  provider: "none"    # none = 촬영목록+AI프롬프트만 저장 / openai = AI 보조이미지 실제 생성(OPENAI_API_KEY 필요)
  per_post_ai: 1      # 글당 AI 보조이미지(썸네일/배경) 개수. 음식 실물은 직접 촬영 권장.

# 2단계 예약 발행 설정
publish:
  mode: "assist"      # assist(권장) | full  — 위 설명 참고

# 브랜드 정보 — 프롬프트에 자동으로 채워집니다.
# ✅ 확정 항목은 채워뒀고, ⚠️ 항목만 실제 정보로 바꿔주세요.
brand:
  name: "베어글스 송도점"
  region: "송도"                   # 검색 키워드 기준(송도 베이글, 송도 카페 …)
  address: "인천광역시 연수구 하모니로 158 C동 108호"
  hours: "[영업시간 입력]"          # ⚠️ 예: 매일 08:00-21:00
  phone: "[전화번호 입력]"          # ⚠️
  instagram: "[@인스타계정 입력]"   # ⚠️
