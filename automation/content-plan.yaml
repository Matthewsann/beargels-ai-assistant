# 이번 주 발행 계획 — 여기 변수만 매주(또는 매달) 바꾸면 나머지는 자동입니다.
# type 은 프롬프트 종류이며 아래 값 중 하나: 신메뉴 / 이벤트 / 일상 / 후기 / 정보성

posts:
  - type: "신메뉴"
    vars:
      메뉴이름: "수제 소금빵"
      핵심특징: "프랑스산 발효버터, 겉바속촉"
      맛포인트: "짭짤 고소, 겉은 바삭 속은 쫄깃"
      가격: "3,500원"
      추천상황: "아침 식사 대용, 베어 라떼와 함께"

  - type: "일상"
    vars:
      소재: "새벽 배송 정리부터 첫 손님까지, 오픈 준비의 하루"

  - type: "정보성"
    vars:
      주제: "베이글 가장 맛있게 데우는 법 (에어프라이어/오븐)"
