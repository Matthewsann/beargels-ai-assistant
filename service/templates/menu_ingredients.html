<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>베어글스 · 자재/레시피</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#2b2620;--sub:#8b8378;--line:#e7e2d8;
--brown:#7a5c3e;--brownbg:#efe7db;--red:#c0392b;--redbg:#fdecea;--amber:#b7791f;--amberbg:#fdf6e3;
--green:#1e7b4f;--greenbg:#e9f2ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
h1{font-size:16px;margin:0}
h1 a{font-size:12px;font-weight:400;margin-left:8px;color:var(--brown)}
.tabs{display:flex;gap:6px;margin-top:8px}
.tab{flex:1;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:10px;
padding:8px 4px;font-size:13px;cursor:pointer}
.tab.on{background:var(--brown);border-color:var(--brown);color:#fff}
.bar{display:flex;gap:8px;margin-top:8px}
.bar input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.bar button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
main{padding:10px;max-width:860px;margin:0 auto}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;
font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--brownbg);font-size:11px;color:var(--brown);font-weight:600}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:none}
tr.cat td{background:#f1ede4;text-align:left;font-weight:700;font-size:12px;color:var(--brown)}
.ed{cursor:pointer;border-bottom:1px dashed #cbc2b4}
.ed:hover{background:#fdf9ef}
td input{width:80px;font-size:13px;padding:2px 5px;border:1px solid var(--brown);border-radius:4px;text-align:right}
td input.l{width:150px;text-align:left}
.del{color:var(--red);cursor:pointer;font-size:12px}
.sub{color:var(--sub);font-size:11px}
.note{font-size:11.5px;color:var(--sub);margin:12px 4px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:13px}
.sum b.big{font-size:18px}
.sum .rec{color:var(--green)}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;background:var(--brownbg);color:var(--brown);margin-left:6px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;
padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}
.addrow input,.addrow select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.addrow button{border:none;background:var(--brown);color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
.menu-pick{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:8px}
.empty{text-align:center;color:var(--sub);padding:36px 12px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-top:6px;-webkit-overflow-scrolling:touch}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:14px;
padding:4px 11px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.fchip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.fchip.warn{border-color:var(--red);color:var(--red);background:var(--redbg)}
.fchip.warn.on{background:var(--red);border-color:var(--red);color:#fff}
.fchip small{opacity:.65;margin-left:3px;font-size:10px}
.bar select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12px;background:var(--card);color:var(--ink)}
.cnt{font-size:11px;color:var(--sub);margin:4px 2px}
.faxis{flex:0 0 auto;align-self:center;font-size:10px;color:var(--sub);margin-right:2px}
.ac{position:relative;flex:1;min-width:150px}
.ac input{width:100%}
.aclist{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:30;background:var(--card);
border:1px solid var(--line);border-radius:8px;max-height:250px;overflow:auto;display:none;
box-shadow:0 8px 22px rgba(0,0,0,.10)}
.aclist.on{display:block}
.acitem{padding:9px 11px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);
display:flex;justify-content:space-between;gap:8px}
.acitem:last-child{border-bottom:none}
.acitem.hl{background:var(--brownbg)}
.acitem .sub{white-space:nowrap}
.acnone{padding:10px 11px;font-size:12px;color:var(--sub)}
.ewrap{display:inline-flex;gap:4px;align-items:center}
.supsel{font-size:12px;padding:3px 5px;border:1px solid var(--brown);border-radius:5px;background:var(--card);color:var(--ink)}
/* 짝 맞추기 */
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:9px;
padding:0 6px;font-size:10px;margin-left:4px;vertical-align:1px}
.tab.on .badge{background:#fff;color:var(--brown)}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:16px;margin:10px 0;text-align:center}
.mcard .nm{font-size:19px;font-weight:700;line-height:1.35}
.mcard .sp{color:var(--sub);font-size:12.5px;margin-top:6px}
.mcard .up{font-size:15px;color:var(--brown);font-weight:700;margin-top:8px}
.mbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:2px 0 8px}
.mbar i{display:block;height:100%;background:var(--brown)}
.cand{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:12px 13px;margin-bottom:7px;cursor:pointer;font-size:14px;color:var(--ink)}
.cand:hover{border-color:var(--brown);background:#fffdf6}
.cand.bad{opacity:.62}
.cand .k{flex:0 0 22px;height:22px;border-radius:6px;background:var(--brownbg);
color:var(--brown);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cand .t{flex:1;min-width:0}
.cand .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .sc{flex:0 0 auto;font-size:11px;color:var(--sub)}
.mact{display:flex;gap:8px;margin-top:12px}
.mact button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;
padding:12px 8px;font-size:13px;cursor:pointer;color:var(--ink)}
.mact button.pri{background:var(--green);border-color:var(--green);color:#fff}
.okbtn{border:none;background:var(--green);color:#fff;border-radius:5px;
padding:3px 8px;font-size:12px;cursor:pointer;line-height:1.4}
/* 엑셀식 일괄편집 */
.bcell{width:100%;min-width:62px;font-size:12.5px;padding:4px 5px;border:1px solid var(--line);
border-radius:4px;text-align:right;background:#fff;font-variant-numeric:tabular-nums}
.bcell.l{text-align:left;min-width:92px}
.bcell:focus{outline:none;border-color:var(--brown);background:#fffdf6}
.bcell.chg{border-color:var(--amber);background:var(--amberbg)}
table.bulk th,table.bulk td{padding:4px 6px}
table.bulk{min-width:760px}
.bulkbtn{border:1px solid var(--brown);background:var(--card);color:var(--brown);border-radius:8px;
padding:7px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.bulkbtn.on{background:var(--brown);color:#fff}
.bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.10);
padding:9px 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.bulkbar select{border:1px solid var(--line);border-radius:7px;padding:6px 7px;font-size:12px;background:var(--card);color:var(--ink)}
.bulkbar button{border:none;border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer}
.bulkbar .save{background:var(--green);color:#fff}
.bulkbar .save:disabled{background:var(--line);color:var(--sub);cursor:default}
.bulkbar .cancel{background:var(--brownbg);color:var(--brown)}
.bulkbar .cnt2{margin-right:auto;color:var(--sub)}
.bulkbar .cnt2 b{color:var(--amber)}
body.padded main{padding-bottom:76px}
td.ck,th.ck{width:26px;text-align:center;padding-left:6px;padding-right:2px}
td.ck input{width:16px;height:16px}
</style>
</head>
<body>
{% include "_sidebar.html" %}
<header>
  <h1>🧺 자재 · 레시피 <a href="/{{ key }}/menu">← 메뉴/원가</a></h1>
  <div class="tabs">
    <div class="tab on" id="tabIng" onclick="TAB='ing';render()">🧺 자재 목록</div>
    <div class="tab" id="tabRec" onclick="TAB='rec';render()">📖 메뉴 레시피</div>
    <div class="tab" id="tabMatch" onclick="TAB='match';render()">🔗 짝 맞추기</div>
  </div>
</header>
<main id="main"><div class="empty">불러오는 중…</div></main>
<div id="toast"></div>

<script>
const BASE = "/{{ key }}/menu";
let DATA=null, TAB='ing', Q='', SKU=null, CATF='전체', SORT='cat', MQ='', MCAT='전체', ICATM='전체', SUPF='전체';
let BULK=false;          // 엑셀식 일괄편집 모드
let EDITS={};            // {자재id: {필드: 값}}  — 저장 전 변경분
let SEL=new Set();       // 일괄 적용용 선택 줄
let RBULK=false, REDITS={};   // 레시피 탭 일괄편집
let PICK=false, PQ='', PSEL=new Set();   // 재료 여러 개 고르기
let DRAFT=[];                            // 아직 저장 안 한 새 재료 [{ingredient_id, qty}]
const won=n=>n==null?"–":Math.round(n).toLocaleString("ko-KR");
const w1=n=>n==null?"–":(Math.round(n*100)/100).toLocaleString("ko-KR");
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),1600);}
async function api(path, body){
  const r=await fetch(BASE+path,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({ok:false}));
  if(!j.ok){toast("⚠ "+(j.error||"실패"));return null;}
  return j;
}
const unitCost=i=>i.pack_qty?i.pack_cost/i.pack_qty:0;
const usedCount=id=>DATA.recipes.filter(r=>r.ingredient_id===id).length;
const cats=()=>[...new Set(DATA.ingredients.map(i=>i.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
// 백엔드 _norm_ing_name 과 같은 규칙 — 공백·구두점·대소문자 무시
const nname=s=>(s||"").replace(/[\s·\-_\/,.()\[\]]+/g,"").toLowerCase();
// 검색 매칭 — 띄어쓰기·대소문자·기호를 무시한다(사장님 보고 2026-08-13).
// 메뉴명에 &·[]·+ 가 섞여 있어("파리지엔 잠봉&뵈르 샌드위치") 보이는 대로
// "잠봉 뵈르"를 쳐도 안 잡혔다.
const skey=s=>(s||"").toLowerCase().replace(/[\s&·・+\-_/.,()\[\]'"]/g,"");
const hit=(q,...fields)=>{
  const n=skey(q);
  return !n || fields.some(f=>skey(f).includes(n));
};
// 검색어 지우기 — 껍데기를 다시 그리지 않으므로 입력칸 값도 직접 비운다.
function clearSearch(id,setter){
  setter("");
  const el=document.getElementById(id);
  if(el){ el.value=""; el.focus(); }
}
const findDup=(name,exceptId)=>DATA.ingredients.find(i=>i.id!==exceptId&&nname(i.name)===nname(name));
// 자재 id → 그 자재가 들어가는 메뉴 분류들. 한 자재가 여러 분류에 걸치므로
// 자재의 '분류'(구매·보관 기준)를 대체하지 않고, 보는 축을 하나 더 두는 것.
let _mcMap=null;
function menuCatsByIng(){
  if(_mcMap) return _mcMap;
  const bySku={}; for(const i of DATA.items) bySku[i.sku]=i;
  const m={};
  for(const r of DATA.recipes){
    const it=bySku[r.sku]; if(!it) continue;
    (m[r.ingredient_id]=m[r.ingredient_id]||new Set()).add(it.category||"기타");
  }
  return _mcMap=m;
}
const dupNames=()=>{const seen={},out=new Set();
  for(const i of DATA.ingredients){const k=nname(i.name);
    if(seen[k]){out.add(k);out.add(nname(seen[k].name));}else seen[k]=i;}
  return out;};
// 이름이 똑같은 묶음 — 띄어쓰기·괄호만 다른 것도 같은 묶음으로 본다.
function dupGroups(){
  const by={};
  for(const i of DATA.ingredients) (by[nname(i.name)]=by[nname(i.name)]||[]).push(i);
  return Object.values(by).filter(g=>g.length>1)
    .sort((a,b)=>a[0].name.localeCompare(b[0].name,"ko"));
}
// 이름은 다르지만 헷갈릴 만한 짝 — 한쪽이 다른 쪽으로 시작하고 길이차가 작을 때
// (예: '초코소스' vs '초코소스A'). 초성이 같은 것까지 넣으면 소음이 커서 뺐다.
function nearGroups(){
  const list=[...DATA.ingredients].sort((a,b)=>nname(a.name).localeCompare(nname(b.name)));
  const exact=new Set(dupGroups().flat().map(i=>i.id));
  const out=[];
  for(let i=0;i<list.length-1;i++){
    const a=nname(list[i].name), b=nname(list[i+1].name);
    if(a===b) continue;
    if(b.startsWith(a) && b.length-a.length<=2 && a.length>=2
       && !exact.has(list[i].id) && !exact.has(list[i+1].id))
      out.push([list[i],list[i+1]]);
  }
  return out;
}
const SUPPLIERS=["쿠팡","엠즈푸드","본사","직접제조","그외"];
// 자재 분류 — 구매·보관 기준(메뉴 분류와 별개 축). 발주할 때 묶이는 단위로 잡았다.
// 반제품은 분류가 아니라 이름에 "(반제품)"으로 표시하고, 발주처를 '직접제조'로 둔다.
const CAT_PRESET=["유제품","베이커리","육류·계란","채소·과일","소스·시럽·잼",
  "가루·당류·조미","커피·차","음료","냉동·냉장 완제품","포장·소모품","비품·청소"];
const catOpts=()=>[...new Set([...CAT_PRESET,...cats()])];
const SORTS=[["cat","분류순"],["name","이름순"],["unit_desc","단위단가 높은순"],["unit_asc","단위단가 낮은순"],
             ["cost_desc","구매가 높은순"],["used_desc","많이 쓰는 순"],["used_asc","적게 쓰는 순"],["sup","발주처순"]];

// ── 자재 탭 ──────────────────────────────────────────────
function renderIng(){
  const q=Q.trim();
  let list=DATA.ingredients.filter(i=>!q||i.name.includes(q));
  let html=`<div class="bar">
    <input id="ingSearch" placeholder="자재 검색 (이름·분류·발주처)…" value="${Q}"
           oninput="Q=this.value;renderIng2()">
    <button onclick="clearSearch('ingSearch',v=>{Q=v;renderIng2()})">✕</button>
    <select onchange="SORT=this.value;renderIng2()">
      ${SORTS.map(([v,l])=>`<option value="${v}" ${v===SORT?"selected":""}>${l}</option>`).join("")}
    </select>
    <button class="bulkbtn ${BULK?"on":""}" onclick="toggleBulk()">${BULK?"✏️ 편집중":"✏️ 일괄편집"}</button>
  </div>
  <div class="fchips" id="catChips"></div>
  <div class="fchips" id="menuCatChips"></div>
  <div class="fchips" id="supChips"></div>
  <div class="cnt" id="cnt"></div>
  <div class="addrow">
    <input id="niName" placeholder="새 자재 이름" style="flex:1;min-width:120px">
    <input id="niCat" list="catList" placeholder="분류" style="width:110px">
    <datalist id="catList">${catOpts().map(c=>`<option value="${c}">`).join("")}</datalist>
    <select id="niSup"><option value="">발주처</option>${SUPPLIERS.map(x=>`<option>${x}</option>`).join("")}</select>
    <select id="niUnit"><option>g</option><option>ml</option><option>ea</option></select>
    <input id="niQty" type="number" placeholder="구매량" style="width:80px">
    <input id="niCost" type="number" placeholder="구매가(원)" style="width:95px">
    <button onclick="addIng()">+ 등록</button>
  </div>
  <div class="addrow" style="border-top:1px dashed var(--line);padding-top:8px">
    <span class="sub" style="align-self:center">🍳 직접 만드는 것</span>
    <input id="npName" placeholder="반제품 이름 (예: 플레인 크림치즈)" style="flex:1;min-width:150px">
    <input id="npQty" type="number" step="any" placeholder="산출량" style="width:90px">
    <select id="npUnit"><option>g</option><option>ml</option><option>ea</option></select>
    <button onclick="addPrep()">+ 반제품 만들기</button>
  </div>
  <div class="addrow">
    <span class="sub" style="align-self:center">📦 발주 사이트</span>
    <button class="bulkbtn" id="msfsBtn" onclick="importMsfs()">엠즈푸드 품목 169개 넣기/갱신</button>
    <span class="sub">이미 있는 이름은 값만 갱신 · 여러 번 눌러도 안전</span>
  </div>
  <div class="wrap"><table id="ingTable"></table></div>
  <p class="note">· 값을 고친 뒤 <b>엔터</b> 또는 <b>✓</b> 를 눌러야 저장됩니다(입력 도중엔 저장되지 않아요).<br>\n  · 구매량/구매가를 탭해서 고치면 <b>그 자재를 쓰는 모든 메뉴의 원가가 즉시 재계산</b>됩니다.<br>
  · 같은 이름은 하나만 등록됩니다(단위가 달라도). 이미 있는 자재는 새로 만들지 말고 수정하세요.<br>
  · 필터는 세 축입니다 — <b>발주처</b> 줄로 "쿠팡에서 시킬 것"만 모아 볼 수 있습니다.<br>\n  · 나머지 두 축은 — <b>자재</b> 줄은 구매·보관 기준, <b>메뉴</b> 줄은 그 자재가 들어가는 메뉴 분류(레시피로 자동, 한 자재가 여러 분류에 걸칠 수 있음). 두 축을 함께 걸 수 있습니다.<br>
  · 위 칩으로 분류를 걸러 보고, 오른쪽 드롭다운으로 정렬을 바꿉니다("미사용"은 어떤 레시피에도 안 쓰는 자재).<br>
  · 분류는 직접 입력하거나 기존 분류에서 고르면 됩니다(빈칸이면 "미분류"). 표에서 분류를 탭해 나중에 바꿀 수도 있습니다.<br>
  · <b>반제품</b>(매장에서 만들어 쓰는 것)은 <b>+ 반제품 만들기</b>로 등록하세요.
    이름 뒤에 <b>(반제품)</b>이 붙고 발주처는 <b>직접제조</b>가 됩니다.
    <b>산출량</b>은 한 번 만들면 총 몇 g/ml/개가 나오는지 — 예) 플레인 크림치즈 750g.
    만든 뒤 들어가는 재료(크림치즈·생크림·설탕…)를 레시피로 넣으면
    <b>배치 원가 ÷ 산출량</b>이 그 자재의 단가가 되고, 그걸 쓰는 메뉴 원가까지 자동으로 따라옵니다.<br>
  · <b>✏️ 일괄편집</b>을 켜면 엑셀처럼 여러 칸을 연달아 고치고 <b>맨 아래 저장</b>으로 한 번에 반영합니다
    (Tab=오른쪽, Enter=아래 줄, 체크한 줄에 분류·발주처를 한꺼번에 적용).</p>`;
  document.getElementById("main").innerHTML=html;
  renderIng2();
}
function renderIng2(){
  const q=Q.trim();
  // 분류 필터 칩 — '전체'·분류별·'미사용'(레시피에서 안 쓰는 자재)

  const span=BULK?8:9;
  let html="",cat=null;
  for(let r=0;r<list.length;r++){

    const c=SORT==="sup"?(i.supplier||"미지정"):(i.category||"미분류");
    if((SORT==="cat"||SORT==="sup")&&c!==cat){cat=c;
      html+=`<tr class="cat"><td colspan="${span}">${SORT==="sup"?"발주처: ":""}${c}</td></tr>`;}
    const n=usedCount(i.id);
    if(BULK){
      const v=(f)=>{const e=EDITS[i.id]; return (e&&f in e)?e[f]:i[f];};

      const cur={...i,...(EDITS[i.id]||{})};
      html+=`<tr>

          onchange="bEdit(${i.id},'name',this.value,this)" onkeydown="bKey(event)"></td>
        <td class="l"><input class="bcell l${chg("category")}" list="catList" data-r="${r}" data-c="1"
          value="${(v("category")||"").replace(/"/g,"&quot;")}"
          onchange="bEdit(${i.id},'category',this.value,this)" onkeydown="bKey(event)"></td>
        <td class="l"><select class="bcell l${chg("supplier")}" data-r="${r}" data-c="2"
          onchange="bEdit(${i.id},'supplier',this.value,this)" onkeydown="bKey(event)">
          <option value="">미지정</option>${SUPPLIERS.map(x=>
            `<option ${x===v("supplier")?"selected":""}>${x}</option>`).join("")}</select></td>
        <td><select class="bcell${chg("unit")}" data-r="${r}" data-c="3"
          onchange="bEdit(${i.id},'unit',this.value,this)" onkeydown="bKey(event)">

        <td><input class="bcell${chg("pack_qty")}" type="number" step="any" data-r="${r}" data-c="4" value="${v("pack_qty")??""}"
          onchange="bEdit(${i.id},'pack_qty',this.value,this)" onkeydown="bKey(event)"></td>
        <td><input class="bcell${chg("pack_cost")}" type="number" step="any" data-r="${r}" data-c="5" value="${v("pack_cost")??""}"
          onchange="bEdit(${i.id},'pack_cost',this.value,this)" onkeydown="bKey(event)"></td>

    }
    html+=`<tr>
      <td class="l ed" onclick="editCell(this,${i.id},'name',true)">${i.name}${
        dupSet.has(nname(i.name))?'<span class="pill" style="background:var(--redbg);color:var(--red)">중복</span>':""}</td>
      <td class="l ed" onclick="editCell(this,${i.id},'category',true)">${i.category||"미분류"}</td>

      <td class="ed" onclick="editCell(this,${i.id},'unit',true)">${i.unit}</td>
      <td class="ed" onclick="editCell(this,${i.id},'pack_qty')">${w1(i.pack_qty)}</td>
      <td class="ed" onclick="editCell(this,${i.id},'pack_cost')">${won(i.pack_cost)}</td>
      <td><b>${w1(unitCost(i))}</b><span class="sub">/${i.unit}</span></td>

// ── 짝 맞추기 ───────────────────────────────────────────────
// 발주 사이트에서 받은 자재는 이름이 우리가 쓰던 이름과 조금씩 다르다
// ('투명컵(160z)' vs '투명컵(무지) 16oz(92파이)'). 한 번에 하나씩 보여주고
// 후보를 눌러 잇는다 — 누르면 값은 새 것, 레시피는 기존 것을 그대로 쓴다.
const MSFS="엠즈푸드";
// 이번 등록으로 새로 들어온 줄만 본다('신규등록' 표시). 기존 자재에
// 발주처만 엠즈푸드로 해 두신 것까지 끌어오면 소음이 된다.
const isNew=i=>(i.note||"").includes("신규등록") && !usedCount(i.id)
               && !(i.note||"").includes("확인함");
function bigrams(t){const o=new Set();for(let k=0;k<t.length-1;k++)o.add(t.slice(k,k+2));return o;}
function simScore(a,b){
  const A=nname(a), B=nname(b);
  if(!A||!B) return 0;
  if(A===B) return 1;
  if(A.includes(B)||B.includes(A)) return 0.9;
  const ga=bigrams(A), gb=bigrams(B);
  if(!ga.size||!gb.size) return 0;
  let hit=0; for(const g of ga) if(gb.has(g)) hit++;
  return hit/Math.min(ga.size,gb.size);
}
// 아직 안 이은 신규 자재 중, 그럴듯한 후보가 있는 것만 줄 세운다
function matchQueue(){
  if(typeof MLATER==="undefined") return [];
  if(!DATA) return [];
  // 후보는 '이번에 새로 들어온 것'을 뺀 나머지 전부 — 발주처를 엠즈푸드로
  // 적어두신 기존 자재도 후보가 되어야 한다.
  const olds=DATA.ingredients.filter(i=>!(i.note||"").includes("신규등록"));
  const out=[];
  for(const n of DATA.ingredients.filter(isNew)){
    const c=olds.map(o=>({o,s:simScore(n.name,o.name)}))
      .filter(x=>x.s>=0.34).sort((a,b)=>b.s-a.s).slice(0,5);
    if(c.length && !MLATER.has(n.id)) out.push({n,c});
  }
  // 레시피에 실제로 쓰이는 자재의 짝을 먼저 묻는다 — 안 쓰는 자재를 이어봐야
  // 메뉴 원가는 1원도 안 바뀐다. 쓰는 것부터 끝내면 그 자리에서 원가가 맞아간다.
  const uses=x=>x.c.some(y=>usedCount(y.o.id)>0);
  return out.sort((a,b)=>(uses(b)-uses(a)) || (b.c[0].s-a.c[0].s));
}
let MDONE=0;
function renderMatch(){
  const q=matchQueue();
  const main=document.getElementById("main");
  if(!q.length){
    main.innerHTML=`<div class="empty">
      ${MDONE?`짝 맞추기 ${MDONE}건 끝냈습니다 👍<br><br>`:""}
      더 이을 자재가 없습니다.<br>
      <span class="sub">발주 사이트 품목을 아직 안 넣으셨다면 자재 목록 위쪽 버튼을 눌러주세요.</span>
      ${MLATER.size?`<br><br><button class="bulkbtn" onclick="mLaterBack()">
        나중에 미뤄둔 ${MLATER.size}건 다시 보기</button>`:""}
      </div>`;
    return;
  }
  const {n,c}=q[0];
  const total=q.length+MDONE;
  // 원가가 걸린 건이 몇 개 남았는지 알려준다 — 나머지는 급하지 않다.
  const hot=q.filter(x=>x.c.some(y=>usedCount(y.o.id)>0)).length;
  main.innerHTML=`
    <div class="cnt">${MDONE+1} / ${total} · 남은 ${q.length}건
      ${hot?` · <b style="color:var(--accent)">이 중 ${hot}건은 메뉴 원가에 바로 영향</b>`
           :` · <span class="sub">남은 건 레시피에 안 쓰는 자재예요 — 안 하셔도 원가는 안 바뀝니다</span>`}</div>
    <div class="mbar"><i style="width:${Math.round(MDONE/total*100)}%"></i></div>
    <div class="mcard">
      <div class="sub" style="font-size:11px">엠즈푸드에서 새로 받은 자재</div>
      <div class="nm">${n.name}</div>
      <div class="sp">${w1(n.pack_qty)}${n.unit} · ${won(n.pack_cost)}원 · ${n.category||"미분류"}</div>
      <div class="up">${w1(unitCost(n))}원 / ${n.unit}</div>
      ${n.note?`<div class="sub" style="font-size:11px;margin-top:4px">${n.note}</div>`:""}
    </div>
    <div class="cnt">쓰던 자재 중 <b>같은 것</b>을 누르세요 — 값은 새 것으로 바뀌고 레시피는 그대로 갑니다</div>
    ${c.map((x,k)=>{const bad=x.o.unit!==n.unit;
      return `<button class="cand${bad?" bad":""}" onclick="mLink(${n.id},${x.o.id})">
      <span class="k">${k+1}</span>
      <span class="t"><b>${x.o.name}${bad?'<span class="pill" style="background:var(--redbg);color:var(--red)">단위 다름</span>':""}</b>
        <span class="sub">${w1(unitCost(x.o))}원/${x.o.unit} · ${usedCount(x.o.id)}개 메뉴에 사용</span></span>
      <span class="sc">${Math.round(x.s*100)}%</span>
    </button>`;}).join("")}
    <div class="mact">
      <button class="pri" onclick="mKeep(${n.id})">✨ 다른 자재임 (그냥 두기)</button>
      <button onclick="mSkip()">나중에 →</button>
    </div>
    <p class="note">· 누르면 <b>쓰던 자재의 구매량·가격·발주처가 새 값으로 바뀌고</b>, 새로 받은 쪽은 사라집니다.
      레시피와 원가는 그대로 이어집니다.<br>
    · <b>같은 제품인데 실제로는 쿠팡 등에서 더 싸게 사입 중이면 "다른 자재임"</b>을
      누르세요 — 원가는 실제로 산 가격으로 잡아야 하므로, 쓰던(더 싼) 가격이 유지됩니다.<br>
    · 단위가 다르면(g ↔ ea) 사용량 뜻이 달라져 막습니다 — 자재 목록에서 단위를 먼저 맞춰주세요.<br>
    · <b>다른 자재임</b>을 누르면 둘 다 남고 다시 묻지 않습니다. 키보드 <b>1~5</b>, <b>N</b>, <b>S</b> 로도 됩니다.</p>`;
}
// '나중에' 는 이번 화면에서만 미뤄 둔다(새로고침하면 다시 나온다) —
// 애매한 걸 억지로 결정하게 만들지 않기 위함.
let MLATER=new Set();
function mSkip(){
  const q=matchQueue();
  if(q.length<2){toast("남은 게 이것뿐입니다");return;}
  MLATER.add(q[0].n.id); render();
}
function mLaterBack(){ MLATER=new Set(); render(); }
async function mKeep(id){
  const i=DATA.ingredients.find(x=>x.id===id); if(!i) return;
  const j=await api("/ingredient",{...i,note:((i.note||"")+" · 확인함").trim()});
  if(j){ i.note=j.ingredient?j.ingredient.note:(i.note||"")+" · 확인함"; MDONE++;
    toast("그대로 두었습니다"); render(); }
}
async function mLink(newId, oldId){
  const n=DATA.ingredients.find(x=>x.id===newId);
  const o=DATA.ingredients.find(x=>x.id===oldId);
  if(!n||!o) return;
  if(n.unit!==o.unit){
    toast(`⚠ 단위가 다릅니다 (${o.unit} vs ${n.unit}) — 자재 목록에서 먼저 맞춰주세요`); return;
  }
  const j=await api("/ingredient/merge",{keep_id:oldId,drop_id:newId,price_from:"drop"});
  if(!j) return;
  const d=await fetch(BASE+"/data").then(r=>r.json());
  DATA=d; DATA.ingredients=d.ingredients||[]; DATA.recipes=d.recipes||[]; _mcMap=null;
  MDONE++;
  const cnt=Object.keys(j.recomputed||{}).length;
  toast(`'${o.name}' 값 갱신 ✓${cnt?` · 메뉴 ${cnt}개 원가 재계산`:""}`);
  render();
}
document.addEventListener("keydown",e=>{
  if(TAB!=='match'||e.target.tagName==="INPUT") return;
  const q=matchQueue(); if(!q.length) return;
  const {n,c}=q[0];
  if(e.key>="1"&&e.key<="5"){ const x=c[+e.key-1]; if(x) mLink(n.id,x.o.id); }
  else if(e.key.toLowerCase()==="n") mKeep(n.id);
});

// ── 중복 자재 보기 ──────────────────────────────────────────
// 목록에 섞어 두면 짝을 눈으로 찾아야 한다. 짝끼리 붙여 놓고, 어느 쪽을
// 남길지 바로 고르게 한다. 남기는 쪽으로 레시피가 옮겨가고 나머지는 지워진다.
function renderDup(tbl){
  const groups = CATF==="이름중복" ? dupGroups() : nearGroups();
  tbl.className="";
  if(!groups.length){
    tbl.innerHTML=`<tr><td class="empty">${
      CATF==="이름중복"?"이름이 겹치는 자재가 없습니다 👍"
                      :"헷갈릴 만한 이름이 없습니다 👍"}</td></tr>`;
    const c=document.getElementById("cnt"); if(c) c.textContent="";
    bBar(); return;
  }
  let html=`<tr><th class="l">자재</th><th class="l">분류·발주처</th><th>단위단가</th>
    <th>사용<br>메뉴</th><th>이걸로<br>합치기</th></tr>`;
  groups.forEach((g,gi)=>{
    const title=CATF==="이름중복"?g[0].name:`${g[0].name} / ${g[1].name}`;
    html+=`<tr class="cat"><td colspan="5">${gi+1}. ${title}
      <span class="sub">— ${g.length}개</span></td></tr>`;
    // 많이 쓰는 쪽을 위로: 대개 그쪽이 '진짜'다
    const sorted=[...g].sort((a,b)=>usedCount(b.id)-usedCount(a.id));
    for(const i of sorted){
      const n=usedCount(i.id);
      const others=sorted.filter(x=>x.id!==i.id);
      html+=`<tr>
        <td class="l"><b>${i.name}</b><br><span class="sub">#${i.id} · ${w1(i.pack_qty)}${i.unit} / ${won(i.pack_cost)}원</span></td>
        <td class="l">${i.category||"미분류"}<br><span class="sub">${i.supplier||"발주처 미지정"}</span></td>
        <td><b>${w1(unitCost(i))}</b><span class="sub">/${i.unit}</span></td>
        <td>${n?`${n}개`:'<span class="sub">안 씀</span>'}</td>
        <td>${others.map(o=>`<button class="okbtn" style="margin:1px 0"
          onclick="mergeIng(${i.id},${o.id})">← #${o.id} 흡수</button>`).join("<br>")}</td>
      </tr>`;
    }
  });
  tbl.innerHTML=html;
  const c=document.getElementById("cnt");
  if(c) c.textContent=`${CATF==="이름중복"?"이름이 같은":"헷갈릴 만한"} 묶음 ${groups.length}개`;
  bBar();
}
async function mergeIng(keepId, dropId){
  const keep=DATA.ingredients.find(i=>i.id===keepId);
  const drop=DATA.ingredients.find(i=>i.id===dropId);
  if(!keep||!drop) return;
  const n=usedCount(dropId);
  if(!confirm(`'${drop.name}'을(를) '${keep.name}'에 합칩니다.\n\n`
    +`· '${drop.name}'을 쓰던 메뉴 ${n}개가 '${keep.name}'을 쓰게 됩니다\n`
    +`· 한 메뉴에 둘 다 있으면 사용량을 더합니다\n`
    +`· '${drop.name}'은 삭제되고, 남는 값은 '${keep.name}'(${w1(unitCost(keep))}원/${keep.unit})입니다\n\n`
    +`진행할까요?`)) return;
  const j=await api("/ingredient/merge",{keep_id:keepId,drop_id:dropId});
  if(!j) return;
  DATA.ingredients=DATA.ingredients.filter(i=>i.id!==dropId);
  for(const r of DATA.recipes) if(r.ingredient_id===dropId) r.ingredient_id=keepId;
  for(const [sku,c] of Object.entries(j.recomputed||{})){
    const it=DATA.items.find(x=>x.sku===sku); if(it) it.ingredient_cost=c;
  }
  _mcMap=null;
  const d=await fetch(BASE+"/data").then(r=>r.json());   // 합쳐진 사용량까지 정확히
  DATA=d; DATA.ingredients=d.ingredients||[]; DATA.recipes=d.recipes||[];
  toast(`합침 ✓ 레시피 ${j.moved}줄 이동${j.merged?` · ${j.merged}줄 사용량 합산`:""}`);
  render();
}

async function bSave(){
  const ids=Object.keys(EDITS).map(Number);
  if(!ids.length) return;
  const rows=ids.map(id=>({...DATA.ingredients.find(x=>x.id===id),...EDITS[id]}));
  // 저장 전 이름 중복 자체검사 — 서버도 막지만, 여기서 먼저 알려주는 게 빠르다.
  // 이번에 이름을 실제로 바꾼 줄만 본다 — 원래부터 겹쳐 있던 자재까지
  // 막으면 상관없는 수정이 통째로 걸린다.
  const clash=[];
  for(const r of rows){
    if(EDITS[r.id].name===undefined) continue;
    const dup=DATA.ingredients.find(x=>x.id!==r.id&&nname(x.name)===nname(r.name)&&!ids.includes(x.id));
    const twice=rows.filter(o=>nname(o.name)===nname(r.name)).length>1;
    if(dup||twice) clash.push(r.name);
  }
  if(clash.length){
    toast(`⚠ 이름이 겹칩니다: ${[...new Set(clash)].slice(0,3).join(", ")}`);
    return;
  }
  const btn=document.querySelector("#bulkBar .save");
  if(btn){btn.disabled=true;btn.textContent="저장 중…";}
  const j=await api("/ingredients/batch",{rows});
  if(!j){ if(btn){btn.disabled=false;btn.textContent=`저장 (${ids.length}줄)`;} return; }
  for(const row of j.saved||[]){
    const k=DATA.ingredients.findIndex(x=>x.id===row.id);
    if(k>=0) DATA.ingredients[k]=row; else DATA.ingredients.push(row);
    delete EDITS[row.id];
  }
  for(const [sku,c] of Object.entries(j.recomputed||{})){
    const it=DATA.items.find(x=>x.sku===sku); if(it) it.ingredient_cost=c;
  }
  _mcMap=null;
  const err=(j.errors||[]).length;
  toast(err?`${(j.saved||[]).length}줄 저장 · ${err}줄 실패(${j.errors[0].error})`
           :`${(j.saved||[]).length}줄 저장 ✓ · 메뉴 ${Object.keys(j.recomputed||{}).length}개 원가 재계산`);
  renderIng2();
}

// 저장은 '엔터' 또는 '✓' 를 눌렀을 때만. 입력 도중 포커스가 빠져도(모바일
// 키보드 닫힘·다른 곳 탭) 저장되지 않는다 — 조합 중 값이 저장되던 문제.
function inlineEdit(td, value, {isText=false, onSave}){
  if(td.querySelector("input")) return;
  const prev=td.innerHTML;
  td.innerHTML=`<span class="ewrap"><input class="${isText?'l':''}" type="${isText?'text':'number'}"
    step="any" value="${value??''}"><button class="okbtn" type="button">✓</button></span>`;
  const inp=td.querySelector("input"), ok=td.querySelector(".okbtn");
  let composing=false, done=false;
  inp.addEventListener("compositionstart",()=>composing=true);
  inp.addEventListener("compositionend",()=>composing=false);
  const cancel=(quiet)=>{ if(done)return; done=true; td.innerHTML=prev;
    if(!quiet) toast("취소됨 — 저장하려면 엔터나 ✓"); };
  const save=()=>{ if(done)return; done=true;
    const v=isText?inp.value.trim():(inp.value===""?null:+inp.value);
    onSave(v, ()=>{td.innerHTML=prev;}); };
  inp.onkeydown=e=>{
    if(e.key==="Enter"){ if(composing) return; e.preventDefault(); save(); }
    else if(e.key==="Escape"){ e.preventDefault(); cancel(true); }
  };
  ok.onmousedown=e=>{ e.preventDefault(); save(); };   // blur 보다 먼저 실행
  inp.onblur=()=>setTimeout(()=>cancel(false),120);
  inp.focus(); inp.select();
}

function fee(ch){return (DATA.settings.channel_fees||{})[ch]||{};}
function feeRate(ch){const f=fee(ch);const b=((+f.commission||0)+(+f.payment||0))/100;
  return f.vat_on_fees===false?b:b*1.1;}
function target(cat){const t=DATA.settings.target_cost_rates||{};return (t[cat]??t["기타"]??35)/100;}

const lineCount=sku=>DATA.recipes.filter(r=>r.sku===sku).length;

// 포장·소모품 판별 — 원가율의 분자는 '식자재'여야 목표(35% 등)와 비교가 된다.
// 컵·뚜껑·스트로우는 실제로 나가는 돈이지만 식자재가 아니므로 따로 센다.
// 분류를 '포장·소모품'으로 정리하기 전에는 이름으로도 잡아준다.
const PACK_WORDS=["컵","뚜껑","스트로우","빨대","캐리어","봉투","용기","보틀병","홀더",
  "포크","나이프","스푼","냅킨","트레이","랩","호일","파우치","캡","포장","박스","상자",
  "띠지","스티커","소스통","유산지","시트"];
function isPack(ing){
  if(!ing) return false;
  const c=ing.category||"";
  if(c==="포장·소모품"||c==="비품·청소"||c==="비품") return true;
  if(c&&c!=="미분류"&&!PACK_WORDS.some(w=>c.includes(w))) return false;  // 분류가 잡혔으면 그 말을 믿는다
  return PACK_WORDS.some(w=>ing.name.includes(w));
}
// {food, pack, total} 로 나눠 계산
function costSplit(sku){
  let food=0, pack=0;
  for(const ln of DATA.recipes.filter(r=>r.sku===sku)){
    const ing=DATA.ingredients.find(i=>i.id===ln.ingredient_id);
    if(!ing) continue;
    const amt=(+ln.qty||0)*unitCost(ing);
    if(isPack(ing)) pack+=amt; else food+=amt;
  }
  return {food, pack, total:food+pack};
}

// 메뉴 목록 — 검색·분류·'레시피 없음' 필터. 탭하면 편집 화면으로.
function renderRecList(){
  const q=MQ.trim();
  const mcats=[...new Set(DATA.items.map(i=>i.category).filter(Boolean))];
  const noRecipe=DATA.items.filter(i=>!lineCount(i.sku)).length;
  const chipDefs=[["전체",DATA.items.length],["레시피 없음",noRecipe],
    ...mcats.map(c=>[c,DATA.items.filter(i=>i.category===c).length])];
  let list=DATA.items.filter(i=>{
    if(!hit(q,i.name,i.sku,i.category)) return false;
    if(MCAT==="전체") return true;
    if(MCAT==="레시피 없음") return !lineCount(i.sku);
    return i.category===MCAT;
  });
  let rows="";
  for(const it of list){
    const n=lineCount(it.sku);
    const cost=it.ingredient_cost;
    const sp=costSplit(it.sku);
    // 원가율 기준은 매장가 — 배달가는 수수료를 얹어 올린 값이라 원가율이
    // 실제보다 좋아 보인다. 매장가가 없는 배달 전용 메뉴만 배달가로 계산.
    const base=it.store_price??it.delivery_price;
    const basis=it.store_price!=null?"매장":"배달";
    // 목표 원가율과 견주는 분자는 '식자재'다. 포장은 따로 보여준다.
    const rate=(n&&base)?sp.food/base:null;
    const tg=target(it.category);
    rows+=`<tr onclick="SKU='${it.sku}';render()" style="cursor:pointer">
      <td class="l"><b>${it.name}</b><br><span class="sub">${it.sku} · ${it.category||""}</span></td>
      <td>${cost==null&&!n?'<span class="sub">원가 없음</span>':
        `${won(n?sp.food:cost)}${sp.pack?`<br><span class="sub">+포장 ${won(sp.pack)}</span>`:""}`}</td>
      <td style="${rate!=null&&rate>tg?"color:var(--red);font-weight:700":""}">${rate==null?"–":
        `${(rate*100).toFixed(1)}%<br><span class="sub" style="font-weight:400">${basis}가·식자재</span>`}</td>
      <td>${n?`${n}줄`:'<span class="pill" style="background:var(--amberbg);color:var(--amber)">없음</span>'}</td>
      <td class="sub">›</td></tr>`;
  }
  // ⚠️ 검색창은 다시 그리지 않는다. 예전엔 한 글자마다 화면 전체를 새로 그려
  //    입력칸이 통째로 사라졌다가 다시 생겨서, 포커스가 풀리고 한글 조합이
  //    깨졌다("크림치즈"가 "ㅋㄹㅁ…"으로)(사장님 보고 2026-08-13).
  //    그래서 껍데기(검색창 포함)는 한 번만 만들고, 이후엔 칩·건수·표만 갱신한다.
  const main=document.getElementById("main");
  if(!document.getElementById("recSearch")){
    main.innerHTML=`
    <div class="bar"><input id="recSearch" placeholder="메뉴 검색 (이름·SKU·분류)…" value="${MQ}"
      oninput="MQ=this.value;renderRecList()">
      <button onclick="clearSearch('recSearch',v=>{MQ=v;renderRecList()})">✕ 지우기</button></div>
    <div class="fchips" id="recChips"></div>
    <div class="cnt" id="recCnt"></div>
    <div class="wrap"><table id="recTable"></table></div>
    <p class="note">· <b>레시피 없음</b> 칩을 누르면 원가가 아직 없는 메뉴만 모아 봅니다 — 여기부터 채우면 됩니다.<br>
    · 원가율은 <b>매장가 · 식자재</b> 기준입니다 — 배달가는 수수료만큼 올려둔 값이라 원가율이 실제보다 낮게 보이고,
      컵·뚜껑 같은 <b>포장비는 식자재가 아니라서</b> 목표 원가율(35% 등)과 견주면 안 됩니다. 포장비는 옆에 따로 표시됩니다.
      매장에서 안 파는 메뉴만 배달가 기준(칸에 표시). 목표 초과는 빨간색.</p>`;
  }
  document.getElementById("recChips").innerHTML=chipDefs.map(([c,n])=>
    `<span class="fchip ${c===MCAT?"on":""}" onclick="MCAT='${c}';renderRecList()">${c}<small>${n}</small></span>`).join("");
  document.getElementById("recCnt").textContent=
    `${list.length}개 표시 · 탭하면 레시피 편집`+(q?` · 검색: "${q}"`:"");
  document.getElementById("recTable").innerHTML=`
      <tr><th class="l">메뉴</th><th>원가<br>(식자재+포장)</th><th>원가율<br>(식자재)</th><th>레시피</th><th></th></tr>
      ${rows||`<tr><td colspan="5" class="empty">해당 메뉴 없음</td></tr>`}`;
}

function renderRec(){
  if(!SKU){ renderRecList(); return; }
  const it=DATA.items.find(i=>i.sku===SKU);
  if(!it){ SKU=null; renderRecList(); return; }
  let html=`<div class="bar" style="margin-bottom:8px">
    <button onclick="backToList()">← 메뉴 목록</button>
    <div style="flex:1;font-weight:700;align-self:center">${it.name}
      <span class="sub">${it.sku}</span></div>
    <button class="bulkbtn ${RBULK?"on":""}" onclick="toggleRBulk()">${RBULK?"✏️ 편집중":"✏️ 사용량 일괄"}</button>
  </div>`;
  {
    const lines=DATA.recipes.filter(r=>r.sku===SKU);
    let total=0, food=0, pack=0, rows="", ri=0;
    for(const ln of lines){
      const ing=DATA.ingredients.find(i=>i.id===ln.ingredient_id);
      if(!ing) continue;
      const q=(ln.id in REDITS)?REDITS[ln.id]:ln.qty;
      const amt=(+q||0)*unitCost(ing); total+=amt;
      const pk=isPack(ing); if(pk) pack+=amt; else food+=amt;
      const qcell = RBULK
        ? `<td><input class="bcell${(ln.id in REDITS)?" chg":""}" type="number" step="any"
             data-r="${ri}" data-c="0" value="${q??""}"
             onchange="rEdit(${ln.id},this.value,this)" onkeydown="bKey(event)"> ${ing.unit}</td>`
        : `<td class="ed" onclick="editQty(this,${ln.id},${ln.ingredient_id},${ln.qty})">${w1(ln.qty)} ${ing.unit}</td>`;
      rows+=`<tr>
        <td class="l">${ing.name}${pk?'<span class="pill">포장</span>':""}
          <span class="sub"> ${w1(unitCost(ing))}/${ing.unit}</span></td>
        ${qcell}
        <td>${won(amt)}</td>
        <td><span class="del" onclick="delLine(${ln.id})">빼기</span></td></tr>`;
      ri++;
    }
    // 아직 저장 안 한 새 재료 — 사용량만 채우면 된다
    for(let k=0;k<DRAFT.length;k++){
      const d=DRAFT[k];
      const ing=DATA.ingredients.find(i=>i.id===d.ingredient_id);
      if(!ing) continue;
      const amt=(+d.qty||0)*unitCost(ing); total+=amt;
      const pk=isPack(ing); if(pk) pack+=amt; else food+=amt;
      rows+=`<tr style="background:var(--amberbg)">
        <td class="l">${ing.name}${pk?'<span class="pill">포장</span>':""}
          <span class="pill" style="background:var(--amber);color:#fff">새로</span>
          <span class="sub"> ${w1(unitCost(ing))}/${ing.unit}</span></td>
        <td><input class="bcell" type="number" step="any" data-r="${ri}" data-c="0"
          value="${d.qty??""}" placeholder="사용량"
          onchange="dEdit(${k},this.value)" onkeydown="bKey(event)"> ${ing.unit}</td>
        <td>${d.qty?won(amt):'<span class="sub">–</span>'}</td>
        <td><span class="del" onclick="dDrop(${k})">빼기</span></td></tr>`;
      ri++;
    }
    const tg=target(it.category);
    // 포장비는 목표 원가율로 마크업할 대상이 아니라 그대로 얹는 실비다.
    //   권장가 = 식자재 ÷ 목표원가율 + 포장비
    const recStore=total?Math.ceil((food/tg+pack)/100)*100:null;
    const recDeliv=total?Math.ceil((food/tg+pack)/(1-feeRate("coupang"))/100)*100:null;
    const rs=it.store_price?food/it.store_price:null;      // 식자재 기준(목표와 비교)
    html+=`<div class="sum">
      <div>식자재 원가 <b class="big">${won(food)}원</b>
        ${pack?`<span class="sub">+ 포장·소모품 ${won(pack)}원 = 합계 <b>${won(total)}원</b></span>`
               :`<span class="sub">(포장 없음)</span>`}
        <br><span class="sub">정본에 저장된 원가: ${won(it.ingredient_cost)}원 (합계 기준)</span></div>
      <div style="margin-top:6px">목표 원가율 ${(tg*100).toFixed(0)}% 기준 —
        권장 매장가 <b class="rec">${won(recStore)}원</b> ·
        권장 배달가 <b class="rec">${won(recDeliv)}원</b>
        <span class="sub">(식자재 ÷ ${(tg*100).toFixed(0)}% + 포장비${pack?` ${won(pack)}원`:""}, 배달은 쿠팡 수수료 ${(feeRate("coupang")*100).toFixed(1)}% 감안)</span></div>
      <div style="margin-top:6px;border-top:1px dashed var(--line);padding-top:6px">현재 <b>식자재</b> 원가율 —
        ${it.store_price?`매장 <b style="${rs>tg?"color:var(--red)":""}">${(rs*100).toFixed(1)}%</b>`:'매장 <span class="sub">판매 안 함</span>'}
        ${it.delivery_price?` · 배달 <b>${(food/it.delivery_price*100).toFixed(1)}%</b>
          <span class="sub">(수수료 빼면 실질 ${(food/(it.delivery_price*(1-feeRate("coupang")))*100).toFixed(1)}%)</span>`:""}
        ${pack?`<br><span class="sub">포장까지 넣으면 매장 ${it.store_price?(total/it.store_price*100).toFixed(1)+"%":"–"}
          · 배달 ${it.delivery_price?(total/it.delivery_price*100).toFixed(1)+"%":"–"} — 목표 원가율과 견줄 숫자는 위쪽(식자재)입니다.</span>`:""}
      </div>
      <div class="sub" style="margin-top:4px">현재 판매가: 매장 ${won(it.store_price)} · 배달 ${won(it.delivery_price)}
        — <a href="/{{ key }}/menu">가격 수정은 메뉴/원가에서</a></div>
    </div>
    <div class="wrap"><table>
      <tr><th class="l">재료</th><th>사용량</th><th>금액</th><th></th></tr>
      ${rows||`<tr><td colspan="4" class="empty">아직 레시피가 없습니다. 아래에서 재료를 추가하세요.</td></tr>`}
    </table></div>
    ${PICK?pickerHTML():`<div class="addrow">
      <div class="ac">
        <input id="nlIng" placeholder="재료 이름 (초성도 가능)" autocomplete="off"
          oninput="acFilter()" onfocus="acFilter()" onkeydown="acKey(event)" onblur="acBlur()">
        <div class="aclist" id="acList"></div>
      </div>
      <input id="nlQty" type="number" step="any" placeholder="사용량" style="width:80px">
      <button onclick="addLine()">+ 추가</button>
      <button class="bulkbtn" onclick="openPick()">☰ 여러 개 고르기</button>
    </div>`}
    <p class="note">· 재료가 여러 개면 <b>☰ 여러 개 고르기</b> — 체크로 한꺼번에 고른 뒤 사용량만 쭉 채우고
    맨 아래 <b>저장</b> 한 번이면 됩니다(Enter=아래 줄).<br>
    · 사용량은 고친 뒤 <b>엔터</b>나 <b>✓</b> 로 저장합니다.
    이미 있는 줄을 여러 개 고치려면 <b>✏️ 사용량 일괄</b>을 켜세요.<br>\n    · 사용량을 고치거나 재료를 넣고 빼면 <b>원가가 즉시 재계산되어 정본에 저장</b>됩니다.<br>
    · 신메뉴는 메뉴/원가 화면에서 먼저 등록한 뒤, 여기서 레시피를 붙이세요.<br>
    · <b>컵·뚜껑·스트로우 같은 포장은 레시피에 넣는 게 맞습니다</b> — 실제로 나가는 돈이니까요.
      다만 목표 원가율과 견줄 숫자는 <b>식자재</b>이므로 화면에서 따로 셉니다.
      분류를 <b>포장·소모품</b>으로 두면 확실히 갈라지고, 아직 분류가 없으면 이름으로 알아서 잡습니다(<span class="pill">포장</span> 표시).</p>`;
  }
  document.getElementById("main").innerHTML=html;
  if(PICK) pkList();
  rBar();
}

// ── 재료 여러 개 고르기 ─────────────────────────────────────
// 하나씩 넣으면 자동완성 → 사용량 → 추가를 재료 수만큼 반복해야 한다.
// 체크로 한꺼번에 고르고, 사용량은 표에서 쭉 내려가며 채우게 한다.
function openPick(){ PICK=true; PQ=''; PSEL=new Set(); render();
  setTimeout(()=>document.getElementById("pkq")?.focus(),50); }
function closePick(){ PICK=false; render(); }
function pkFilter(v){ PQ=v; pkList(); }
function pkToggle(id){ PSEL.has(id)?PSEL.delete(id):PSEL.add(id); pkList(); }
function pkCands(){
  const used=new Set(DATA.recipes.filter(r=>r.sku===SKU).map(r=>r.ingredient_id));
  for(const d of DRAFT) used.add(d.ingredient_id);
  const nq=nname(PQ), isCho=nq&&[...nq].every(c=>CHO.includes(c));
  return DATA.ingredients.filter(i=>{
    if(used.has(i.id)) return false;          // 이미 들어간 재료는 안 보여준다
    if(!nq) return true;
    const n=nname(i.name);
    return n.includes(nq)||(isCho&&chosung(n).includes(nq));
  }).sort((a,b)=>a.name.localeCompare(b.name,"ko"));
}
function pickerHTML(){
  return `<div class="wrap" style="padding:10px;margin-top:8px">
    <div class="bar" style="margin:0 0 6px">
      <input id="pkq" placeholder="재료 검색 (초성도 가능)…" value="${PQ}"
        oninput="pkFilter(this.value)" autocomplete="off">
      <button class="bulkbtn" onclick="closePick()">닫기</button>
    </div>
    <div id="pkbox" style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px"></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <span class="sub" id="pkcnt" style="margin-right:auto"></span>
      <button class="okbtn" style="padding:8px 16px;font-size:13px" onclick="pkAdd()">선택한 재료 넣기</button>
    </div></div>`;
}
function pkList(){
  const box=document.getElementById("pkbox"); if(!box) return;
  const list=pkCands();
  box.innerHTML=list.length?list.map(i=>
    `<label class="acitem" style="cursor:pointer">
      <span><input type="checkbox" ${PSEL.has(i.id)?"checked":""}
        onchange="pkToggle(${i.id})" style="margin-right:8px;width:16px;height:16px;vertical-align:-2px">
        ${i.name}${isPack(i)?'<span class="pill">포장</span>':""}</span>
      <span class="sub">${w1(unitCost(i))}원/${i.unit}</span></label>`).join("")
    : `<div class="acnone">해당 재료가 없습니다 — 자재 탭에서 먼저 등록하세요</div>`;
  const c=document.getElementById("pkcnt");
  if(c) c.textContent=`${PSEL.size}개 선택 · 목록 ${list.length}개`;
}
function pkAdd(){
  if(!PSEL.size){toast("재료를 하나 이상 골라주세요");return;}
  for(const id of PSEL) DRAFT.push({ingredient_id:id, qty:null});
  const n=PSEL.size; PICK=false; PSEL=new Set(); render();
  toast(`${n}개 추가 — 사용량을 채우고 저장하세요`);
  setTimeout(()=>{const f=document.querySelector('table input.bcell[placeholder="사용량"]');
    if(f){f.focus();f.select();}},60);
}
function dEdit(k,v){
  if(!DRAFT[k]) return;
  DRAFT[k].qty = v===""?null:+v;
  renderRec();
}
function dDrop(k){ DRAFT.splice(k,1); render(); }

// ── 레시피 사용량 일괄편집 ───────────────────────────────────
function backToList(){
  if(DRAFT.length&&!confirm(`저장 안 한 새 재료 ${DRAFT.length}줄이 있습니다. 버릴까요?`)) return;
  DRAFT=[]; REDITS={}; RBULK=false; PICK=false; SKU=null; render();
}
function toggleRBulk(){
  const n=Object.keys(REDITS).length;
  if(RBULK&&n&&!confirm(`저장 안 한 ${n}줄이 있습니다. 버릴까요?`)) return;
  RBULK=!RBULK; REDITS={}; render();
}
function rEdit(rid,val,el){
  const ln=DATA.recipes.find(r=>r.id===rid); if(!ln) return;
  const v=val===""?null:+val;
  if(v===null||v===ln.qty) delete REDITS[rid]; else REDITS[rid]=v;
  el.classList.toggle("chg",rid in REDITS);
  renderRec();                       // 합계·원가율을 바로 다시 계산해 보여준다
  const nx=document.querySelector(`[data-r="${el.dataset.r}"][data-c="0"]`);
  if(nx) nx.focus();
}
function rBar(){
  let bar=document.getElementById("bulkBar");
  const nd=DRAFT.length, ne=Object.keys(REDITS).length;
  const show=(RBULK||nd)&&TAB==='rec'&&SKU;
  if(!show){ if(bar&&!BULK) {bar.remove(); document.body.classList.remove("padded");} return; }
  if(!bar){ bar=document.createElement("div"); bar.id="bulkBar"; bar.className="bulkbar";
    document.body.appendChild(bar); }
  document.body.classList.add("padded");
  const ready=DRAFT.filter(d=>d.qty).length;
  const n=ne+ready;
  bar.innerHTML=`<span class="cnt2">${nd?`새 재료 <b>${ready}/${nd}</b>줄 준비`:""}${
      nd&&ne?" · ":""}${ne?`수정 <b>${ne}</b>줄`:""}${
      nd&&ready<nd?' <span style="color:var(--red)">— 사용량 빈 줄이 있습니다</span>':""}</span>
    <button class="cancel" onclick="${nd?"rCancel()":"toggleRBulk()"}">${nd?"취소":"닫기"}</button>
    <button class="save" ${n?"":"disabled"} onclick="rSave()">저장 ${n?`(${n}줄)`:""}</button>`;
}
function rCancel(){
  if(DRAFT.length&&!confirm(`넣던 새 재료 ${DRAFT.length}줄을 버릴까요?`)) return;
  DRAFT=[]; REDITS={}; RBULK=false; render();
}
async function rSave(){
  const rids=Object.keys(REDITS).map(Number);
  const drafts=DRAFT.filter(d=>d.qty);
  if(DRAFT.length&&drafts.length<DRAFT.length){
    toast("사용량이 빈 줄이 있습니다 — 채우거나 '빼기' 하세요"); return;
  }
  if(!rids.length&&!drafts.length) return;
  const lines=[
    ...rids.map(rid=>{
      const ln=DATA.recipes.find(r=>r.id===rid);
      return {ingredient_id:ln.ingredient_id, qty:REDITS[rid]};
    }),
    ...drafts.map(d=>({ingredient_id:d.ingredient_id, qty:d.qty})),
  ];
  const btn=document.querySelector("#bulkBar .save");
  if(btn){btn.disabled=true;btn.textContent="저장 중…";}
  const j=await api("/recipe/batch",{sku:SKU,lines});
  if(!j){ if(btn){btn.disabled=false;btn.textContent=`저장 (${lines.length}줄)`;} return; }
  DRAFT=[];
  for(const row of j.saved||[]){
    const k=DATA.recipes.findIndex(r=>r.id===row.id);
    if(k>=0) DATA.recipes[k]=row; else DATA.recipes.push(row);
  }
  REDITS={}; _mcMap=null;
  for(const [sku,c] of Object.entries(j.recomputed||{})){
    const it=DATA.items.find(x=>x.sku===sku); if(it) it.ingredient_cost=c;
  }
  const err=(j.errors||[]).length;
  toast(err?`${(j.saved||[]).length}줄 저장 · ${err}줄 실패`:`${(j.saved||[]).length}줄 저장 ✓ 원가 재계산됨`);
  render();
}
// ── 재료 자동완성 ───────────────────────────────────────────
// 브라우저 datalist 는 한글 조합 중 목록을 갱신하지 못해(두 글자부터 사라짐)
// 직접 만든다. 이름·초성(ㅊㅋ→초코) 둘 다로 찾는다.
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
function chosung(str){
  return [...(str||"")].map(ch=>{
    const c=ch.charCodeAt(0)-0xAC00;
    return (c>=0&&c<=11171)?CHO[Math.floor(c/588)]:ch;
  }).join("");
}
let AC_ID=null, AC_LIST=[], AC_HL=0;

function acMatches(q){
  const nq=nname(q);
  if(!nq) return DATA.ingredients.slice(0,12);
  const isCho=[...nq].every(c=>CHO.includes(c));
  return DATA.ingredients.filter(i=>{
    const n=nname(i.name);
    if(n.includes(nq)) return true;
    if(isCho && chosung(n).includes(nq)) return true;
    return false;
  }).slice(0,20);
}
function acFilter(){
  const inp=document.getElementById("nlIng"), box=document.getElementById("acList");
  if(!inp||!box) return;
  AC_LIST=acMatches(inp.value); AC_HL=0;
  if(!AC_LIST.length){
    box.innerHTML=`<div class="acnone">없는 재료입니다 — 자재 탭에서 먼저 등록하세요</div>`;
    box.classList.add("on"); return;
  }
  box.innerHTML=AC_LIST.map((i,idx)=>
    `<div class="acitem ${idx===AC_HL?"hl":""}" onmousedown="acPick(${idx})">
      <span>${i.name}</span>
      <span class="sub">${w1(unitCost(i))}원/${i.unit}</span></div>`).join("");
  box.classList.add("on");
}
function acPick(idx){
  const i=AC_LIST[idx]; if(!i) return;
  AC_ID=i.id;
  const inp=document.getElementById("nlIng");
  inp.value=i.name;
  document.getElementById("acList").classList.remove("on");
  const q=document.getElementById("nlQty");
  q.placeholder=`사용량 (${i.unit})`; q.focus();
}
function acKey(e){
  const box=document.getElementById("acList");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    AC_HL=Math.max(0,Math.min(AC_LIST.length-1,AC_HL+(e.key==="ArrowDown"?1:-1)));
    [...box.querySelectorAll(".acitem")].forEach((el,i)=>el.classList.toggle("hl",i===AC_HL));
    return;
  }
  if(e.key==="Enter"){ e.preventDefault(); if(AC_LIST.length) acPick(AC_HL); return; }
  if(e.key==="Escape"){ box.classList.remove("on"); }
  AC_ID=null;   // 다시 타이핑하면 선택 해제
}
function acBlur(){ setTimeout(()=>document.getElementById("acList")?.classList.remove("on"),150); }

function editQty(td,rid,iid,cur){
  inlineEdit(td, cur, {onSave:async(v,restore)=>{
    if(v===null||v===""||v===cur){ restore(); return; }
    const j=await api("/recipe",{sku:SKU,ingredient_id:iid,qty:v});
    if(j) syncRecipe(j);
    render();
  }});
}

async function addLine(){
  const v=document.getElementById("nlIng").value.trim();
  const qty=+document.getElementById("nlQty").value;
  let ing=AC_ID?DATA.ingredients.find(i=>i.id===AC_ID):null;
  if(!ing){                                  // 직접 타이핑만 한 경우 이름으로 찾기
    const cands=DATA.ingredients.filter(i=>nname(i.name)===nname(v));
    ing=cands.length===1?cands[0]:null;
  }
  if(!ing){toast("목록에서 재료를 선택하세요 (없으면 자재 탭에서 먼저 등록)");return;}
  if(!qty){toast("사용량을 입력하세요");return;}
  const j=await api("/recipe",{sku:SKU,ingredient_id:ing.id,qty});
  if(j){ AC_ID=null; syncRecipe(j); }
  render();
}
async function delLine(rid){
  const j=await api(`/recipe/${rid}/delete`);
  if(j){DATA.recipes=DATA.recipes.filter(r=>r.id!==rid);syncRecipe(j);render();}
}
function syncRecipe(j){
  _mcMap=null;
  if(j.line){
    const i=DATA.recipes.findIndex(r=>r.id===j.line.id);
    if(i>=0) DATA.recipes[i]=j.line; else DATA.recipes.push(j.line);
  }
  for(const [sku,c] of Object.entries(j.recomputed||{})){
    const it=DATA.items.find(x=>x.sku===sku); if(it){it.ingredient_cost=c;}
  }
  toast("저장 ✓ 원가 재계산됨");
}

async function runSeed(){
  const btn=document.getElementById("seedBtn");
  btn.disabled=true; btn.textContent="넣는 중… (최대 1분, 화면을 닫지 마세요)";
  const j=await api("/ingredients/seed");
  if(j){
    toast(`완료: 자재 ${j.ingredients_added} · 레시피 ${j.lines_added} · 원가 재계산 ${j.recomputed}개`);
    const d=await fetch(BASE+"/data").then(r=>r.json());
    DATA=d; DATA.ingredients=d.ingredients||[]; DATA.recipes=d.recipes||[];
  } else { btn.disabled=false; btn.textContent="📦 초기 데이터 넣기 (다시 시도)"; }
  render();
}

function render(){
  if(TAB!=='ing'&&BULK){BULK=false;EDITS={};SEL.clear();}
  if((TAB!=='rec'||!SKU)&&RBULK){RBULK=false;REDITS={};}
  if((TAB!=='rec'||!SKU)&&(DRAFT.length||PICK)){DRAFT=[];PICK=false;PSEL=new Set();}
  const bb=document.getElementById("bulkBar");
  if(bb&&!BULK&&!RBULK){bb.remove();document.body.classList.remove("padded");}
  document.getElementById("tabIng").classList.toggle("on",TAB==='ing');
  document.getElementById("tabRec").classList.toggle("on",TAB==='rec');
  const tm=document.getElementById("tabMatch");
  if(tm&&DATA){ const n=matchQueue().length;
    tm.classList.toggle("on",TAB==='match');
    tm.innerHTML=`🔗 짝 맞추기${n?`<span class="badge">${n}</span>`:""}`; }
  if(!DATA)return;
  if(!DATA.ingredients.length&&TAB==='ing'){
    document.getElementById("main").innerHTML=`<div class="empty">자재 데이터가 아직 없습니다.<br><br>
      <button id="seedBtn" style="border:none;background:var(--brown);color:#fff;border-radius:10px;
        padding:12px 22px;font-size:14px;cursor:pointer" onclick="runSeed()">
        📦 초기 데이터 넣기 (자재 188개 + 레시피 549줄, 1분 소요)</button>
      <p class="note" style="margin-top:10px">2026-08 자재리스트와 기존 원가계산기 레시피를 넣습니다.<br>
      한 번만 누르면 되고, 실수로 다시 눌러도 안전합니다.</p></div>`;
    return;
  }
  if(TAB==='match') renderMatch();
  else if(TAB==='ing') renderIng();
  else renderRec();
}
fetch(BASE+"/data").then(r=>r.json()).then(d=>{
  if(d.error){document.getElementById("main").innerHTML=`<div class="empty">⚠ ${d.error}</div>`;return;}
  DATA=d; DATA.ingredients=d.ingredients||[]; DATA.recipes=d.recipes||[]; _mcMap=null;
  const p=new URLSearchParams(location.search); SKU=p.get("sku")||null;
  if(SKU) TAB='rec';
  render();
});
</script>
</body>
</html>
