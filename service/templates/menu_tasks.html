<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>베어글스 · 채널 작업지시서</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#2b2620;--sub:#8b8378;--line:#e7e2d8;
--brown:#7a5c3e;--brownbg:#efe7db;--red:#c0392b;--redbg:#fdecea;--amber:#b7791f;--amberbg:#fdf6e3;
--green:#1e7b4f;--greenbg:#e9f2ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
h1{font-size:16px;margin:0}
h1 a{font-size:12px;font-weight:400;margin-left:8px;color:var(--brown)}
.chips{display:flex;gap:6px;margin-top:8px}
.chip{flex:1;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:10px;
padding:7px 4px;font-size:12px;cursor:pointer}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.chip small{display:block;font-size:10px;opacity:.75}
.prog{font-size:11px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
main{padding:10px;max-width:760px;margin:0 auto}
.sec{margin-bottom:16px}
.sec h2{font-size:13px;margin:0 0 6px;color:var(--brown);display:flex;justify-content:space-between;align-items:center}
.sec h2 small{color:var(--sub);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:0 0 auto;accent-color:var(--green)}
.row.done .body{opacity:.4;text-decoration:line-through}
.body{flex:1;min-width:0}
.t{font-weight:600;word-break:keep-all}
.d{font-size:12.5px;color:var(--sub);margin-top:2px}
.d b{color:var(--ink)}
.d .to{color:var(--green);font-weight:700}
.d .price{color:var(--red);font-weight:700}
.tag{display:inline-block;font-size:10px;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.tag.p{background:var(--redbg);color:var(--red)}
.tag.n{background:#e8f0fe;color:#1a56db}
.tag.x{background:var(--amberbg);color:var(--amber)}
.tag.a{background:var(--greenbg);color:var(--green)}
.empty{text-align:center;color:var(--sub);padding:40px 16px}
.ctx{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip2{font-size:10.5px;border:1px solid var(--line);border-radius:8px;padding:1px 7px;
color:var(--sub);background:var(--bg);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip2.cur{border-color:var(--brown);color:var(--brown);font-weight:700}
.chip2.master{background:var(--brownbg);color:var(--brown);border-color:var(--brownbg)}
.note{font-size:11.5px;color:var(--sub);margin:14px 4px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;
padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
.hidebox{margin:10px 4px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>📋 채널 작업지시서 <a href="/{{ key }}/menu">← 메뉴/원가</a></h1>
  <div class="chips" id="chips"></div>
  <div class="prog"><span id="progTxt"></span><span id="when"></span></div>
  <div class="bar"><i id="progBar" style="width:0"></i></div>
</header>
<main id="main"><div class="empty">불러오는 중…</div></main>
<div id="toast"></div>

<script>
const BASE = "/{{ key }}/menu";
let DATA=null, CH="baemin", DONE={};
const LABEL={baemin:"배민",coupang:"쿠팡이츠",naver:"네이버"};
const NOISE=/^\[B\]|^\[신메뉴\]$|^\[1~2인 세트\]$|^커피$|^보틀\(1L\)$|^단체주문 10인$|^든든한 샌드위치 세트$|^BEARGLS HEALTHY|^Bear Cream Cheese/;
const won=n=>n==null?"–":Math.round(n).toLocaleString("ko-KR")+"원";
const norm=s=>(s||"").replace(/\[[^\]]*\]/g,"").replace(/[^0-9a-zA-Z가-힣]/g,"").toLowerCase();

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),1200);}

// 유사도(0~1) — 레벤슈타인 기반. '슈패너'↔'슈페너' 같은 한 글자 차이를 짝짓는다.
function sim(a,b){
  const m=a.length,n=b.length;
  if(!m||!n) return 0;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return 1-prev[n]/Math.max(m,n);
}

function ov(sku,ch){return DATA.channels.find(c=>c.sku===sku&&c.channel===ch);}
function fee(ch){return (DATA.settings.channel_fees||{})[ch]||{};}
function expPrice(it,ch){
  const o=ov(it.sku,ch);
  if(o&&o.price_override!=null) return o.price_override;
  if(fee(ch).price_base==="store") return it.store_price;
  return it.delivery_price??it.store_price;
}
function expName(it,ch){const o=ov(it.sku,ch);return (o&&o.name_override)||it.name;}
function activeFor(it,ch){return fee(ch).price_base==="store"?!!it.store_active:!!it.delivery_active;}

let CACHE={};
function analyze(ch){
  if(CACHE[ch]) return CACHE[ch];
  const snaps=(DATA.snapshots||[]).filter(s=>s.channel===ch&&!NOISE.test(s.menu_name));
  const bySku=Object.fromEntries(DATA.items.map(i=>[i.sku,i]));
  const byNorm={};
  for(const i of DATA.items) byNorm[norm(i.name)]??=i.sku;
  for(const o of DATA.channels) if(o.channel===ch&&o.name_override) byNorm[norm(o.name_override)]=o.sku;

  const tasks=[]; const matched=new Set();
  const obs={};                      // sku → 이 채널에 실제 노출 중인 {price,name}
  let extras=[];
  for(const s of snaps){
    const sku=s.matched_sku||byNorm[norm(s.menu_name)];
    const it=bySku[sku];
    if(!it){extras.push(s);continue;}
    matched.add(sku);
    obs[sku]={price:s.price,name:s.menu_name};
    const o=ov(sku,ch);
    if(o&&o.active===false) continue;
    const ep=expPrice(it,ch), en=expName(it,ch);
    if(s.price!=null&&ep!=null&&s.price!==ep)
      tasks.push({type:"price",name:s.menu_name,cur:s.price,to:ep,sku});
    if(norm(s.menu_name)!==norm(en))
      tasks.push({type:"name",name:s.menu_name,to:en,sku});
  }
  let missing=DATA.items.filter(it=>{
    if(!activeFor(it,ch)||matched.has(it.sku)) return false;
    const o=ov(it.sku,ch); return !(o&&o.active===false);
  });
  // 오타·표기 차이 짝짓기 → 이름 수정으로 승격
  const still=[],used=new Set();
  for(const s of extras){
    let best=-1,score=0;
    missing.forEach((it,i)=>{
      if(used.has(i))return;
      const r=sim(norm(s.menu_name),norm(it.name));
      if(r>score){score=r;best=i;}
    });
    if(best>=0&&score>=0.8){
      const it=missing[best];used.add(best);
      obs[it.sku]={price:s.price,name:s.menu_name};
      tasks.push({type:"name",name:s.menu_name,to:expName(it,ch),sku:it.sku});
      const ep=expPrice(it,ch);
      if(s.price!=null&&ep!=null&&s.price!==ep)
        tasks.push({type:"price",name:s.menu_name,cur:s.price,to:ep,sku:it.sku});
    } else still.push(s);
  }
  missing=missing.filter((_,i)=>!used.has(i));
  for(const s of still) tasks.push({type:"extra",name:s.menu_name,cur:s.price});
  for(const it of missing) tasks.push({type:"add",name:it.name,to:expPrice(it,ch),sku:it.sku});
  return CACHE[ch]={tasks,obs};
}
function computeTasks(ch){return analyze(ch).tasks;}

// 항목의 '현 상황' 한 줄 — 세 채널 현재가 + 정본 매장/배달가
function ctx(t){
  const chips=[];
  if(t.sku){
    const it=DATA.items.find(i=>i.sku===t.sku);
    for(const [c,l] of Object.entries(LABEL)){
      const o=analyze(c).obs[t.sku];
      const cur=(c===CH)?" cur":"";
      chips.push(`<span class="chip2${cur}">${l} ${o?won(o.price):"없음"}</span>`);
    }
    if(it) chips.push(`<span class="chip2 master">정본 매장 ${won(it.store_price)} · 배달 ${won(it.delivery_price)}</span>`);
  } else {
    // 정본에 없는 메뉴 — 다른 채널에도 같은 이름이 떠 있는지
    for(const [c,l] of Object.entries(LABEL)){
      const s=(DATA.snapshots||[]).find(x=>x.channel===c&&norm(x.menu_name)===norm(t.name));
      const cur=(c===CH)?" cur":"";
      chips.push(`<span class="chip2${cur}">${l} ${s?won(s.price):"없음"}</span>`);
    }
    chips.push(`<span class="chip2 master">정본 없음</span>`);
  }
  return `<div class="ctx">${chips.join("")}</div>`;
}

function key(ch,t){return ch+"|"+t.type+"|"+t.name;}

let saveTimer=null;
function markDone(ch,t,checked,el){
  DONE[key(ch,t)]=checked||undefined;
  if(!checked) delete DONE[key(ch,t)];
  el.classList.toggle("done",checked);
  renderHeader();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const r=await fetch(BASE+"/settings/task_done",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(DONE)});
    toast(r.ok?"저장됨 ✓":"⚠ 저장 실패");
  },600);
}

const SEC=[["price","💰 가격 수정","p","포털에서 가격만 변경"],
           ["name","✏️ 이름 수정","n","포털에서 메뉴명 변경"],
           ["extra","❓ 정본에 없음","x","옛 메뉴면 내리기 · 파는 메뉴면 웹 /menu 정본에 추가"],
           ["add","➕ 채널에 없음","a","이 채널에서 팔 거면 등록 · 안 팔 거면 /menu에서 해당 채널 판매 체크 끄기"]];

function renderHeader(){
  const counts={};
  for(const ch of Object.keys(LABEL)){
    const ts=computeTasks(ch);
    counts[ch]={total:ts.length,done:ts.filter(t=>DONE[key(ch,t)]).length};
  }
  document.getElementById("chips").innerHTML=Object.entries(LABEL).map(([ch,l])=>{
    const c=counts[ch];
    return `<div class="chip ${ch===CH?"on":""}" onclick="CH='${ch}';render()">${l}<small>${c.done}/${c.total}</small></div>`;
  }).join("");
  const c=counts[CH];
  document.getElementById("progTxt").textContent=`${LABEL[CH]} 진행 ${c.done}/${c.total}`;
  document.getElementById("progBar").style.width=(c.total?c.done/c.total*100:100)+"%";
}

function render(){
  renderHeader();
  const snaps=(DATA.snapshots||[]).filter(s=>s.channel===CH);
  document.getElementById("when").textContent=snaps.length?
    "수집 "+(snaps[0].collected_at||"").slice(0,16).replace("T"," "):"";
  const tasks=computeTasks(CH);
  const hideDone=document.getElementById("hideDone")?.checked??false;
  let html="";
  if(!snaps.length){
    html=`<div class="empty">이 채널의 수집 데이터가 없습니다.<br>집 PC에서 <code>worker\\menu_report.bat</code> 실행 후 새로고침하세요.</div>`;
  } else if(!tasks.length){
    html=`<div class="empty">🎉 이 채널은 정본과 완전히 일치합니다!</div>`;
  } else {
    html=`<label class="hidebox"><input type="checkbox" id="hideDone" ${hideDone?"checked":""}
      onchange="render()"> 완료한 항목 숨기기</label>`;
    for(const [type,title,tag,tip] of SEC){
      const list=tasks.filter(t=>t.type===type&&!(hideDone&&DONE[key(CH,t)]));
      const totalOfType=tasks.filter(t=>t.type===type).length;
      if(!totalOfType) continue;
      html+=`<div class="sec"><h2>${title} <small>${totalOfType}건 · ${tip}</small></h2><div class="card">`;
      if(!list.length) html+=`<div class="row"><div class="body d">전부 완료 ✓</div></div>`;
      for(const t of list){
        const done=!!DONE[key(CH,t)];
        let desc="";
        if(t.type==="price") desc=`<span class="price">${won(t.cur)}</span> → <span class="to">${won(t.to)}</span>`;
        if(t.type==="name") desc=`→ <span class="to">${t.to}</span>`;
        if(t.type==="extra") desc=`채널가 ${won(t.cur)}`;
        if(t.type==="add") desc=`등록 가격 <b>${won(t.to)}</b>`;
        html+=`<label class="row ${done?"done":""}">
          <input type="checkbox" ${done?"checked":""}
            onchange="markDone('${CH}',${JSON.stringify(t).replace(/"/g,"&quot;")},this.checked,this.closest('.row'))">
          <div class="body"><div class="t">${t.name}<span class="tag ${tag}">${title.slice(2)}</span></div>
          <div class="d">${desc}</div>${ctx(t)}</div></label>`;
      }
      html+=`</div></div>`;
    }
    html+=`<p class="note">· 체크는 자동 저장되고 모든 기기에서 공유됩니다.<br>
    · 작업을 마치면 집 PC에서 재수집(menu_report.bat) — 고친 항목은 다음 수집부터 목록에서 사라집니다.<br>
    · 지시서가 이상하면(예: 실제 판매가가 채널 쪽이 맞음) 채널을 고치지 말고
      <a href="/{{ key }}/menu">웹 /menu</a>에서 정본을 고치세요.</p>`;
  }
  document.getElementById("main").innerHTML=html;
}

fetch(BASE+"/data").then(r=>r.json()).then(d=>{
  if(d.error){document.getElementById("main").innerHTML=`<div class="empty">⚠ ${d.error}</div>`;return;}
  DATA=d; DONE=d.settings.task_done||{};
  render();
});
</script>
</body>
</html>
