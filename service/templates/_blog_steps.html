{# 4단계 진행 막대 — 사장님이 정한 순서(2026-09-14): ① 주제 뽑기 → ② 초안 작성
   → ③ 사진 선택 → ④ 임시저장. cur 보다 앞은 끝난 칸(✓), cur 는 지금 할 칸.
   cur=5 면 전부 끝. 홈은 cur=1, 글 화면은 app._blog_step() 이 정한다. #}
<div style="display:flex; gap:4px; margin:4px 0 14px;">
  {% for n, label in [(1, '주제 뽑기'), (2, '초안 작성'), (3, '사진 선택'), (4, '임시저장')] %}
  <div style="flex:1; text-align:center; font-size:11.5px; line-height:1.3; padding:7px 2px;
              border-radius:8px; white-space:nowrap;
              {% if n < cur %}background:var(--ok-bg); color:var(--ok);
              {% elif n == cur %}background:var(--accent-bg); color:var(--accent); font-weight:700;
              {% else %}background:var(--card); color:var(--muted); border:1px solid var(--line);{% endif %}">
    {{ '✓' if n < cur else n }} {{ label }}
  </div>
  {% endfor %}
</div>
