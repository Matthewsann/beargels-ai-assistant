# 직원용 리뷰 답글 서비스 자동 배포
#
# main 에 push 되면 바뀐 파일을 PythonAnywhere 에 직접 올리고 웹앱을 재시작한다.
# 사람이 콘솔에 들어가 git pull + Reload 를 누르지 않아도 된다.
#
# 왜 git pull 이 아니라 파일 업로드인가:
#   처음엔 콘솔 API(send_input)로 git pull 을 보냈는데, 콘솔이 '시작된' 상태가
#   아니면 HTTP 오류로 실패했다(exit 22). 콘솔 상태에 의존하지 않는 Files API
#   업로드가 훨씬 안정적이다. 파일이 몇 개뿐이라 통째로 올려도 부담이 없다.
#
# 필요한 GitHub Secret 2개:
#   PA_API_TOKEN     — PythonAnywhere Account → API token
#   PA_SERVICE_PATH  — 직원 화면 비밀 주소(실행 기록에 남지 않게 Secret 으로)

name: deploy-service

on:
  push:
    branches: [main]
    paths:
      - 'service/**'
      - 'database/supabase_client.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PA_USER: beargels
  PA_DOMAIN: beargels.pythonanywhere.com
  PA_HOST: https://www.pythonanywhere.com
  PA_ROOT: /home/beargels/beargels-ai-assistant

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 바뀐 파일 올리기
        run: |
          set -euo pipefail
          AUTH="Authorization: Token ${{ secrets.PA_API_TOKEN }}"

          upload() {
            local rel="$1"
            local url="$PA_HOST/api/v0/user/$PA_USER/files/path$PA_ROOT/$rel"
            local code
            code=$(curl -s -o /tmp/up.out -w '%{http_code}' -X POST \
                     -H "$AUTH" -F "content=@$rel" "$url")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::업로드 실패 $rel (HTTP $code)"
              head -c 300 /tmp/up.out; echo
              return 1
            fi
            echo "  올림: $rel (HTTP $code)"
          }

          upload service/app.py
          upload service/wsgi.py
          upload service/templates/staff.html
          upload database/supabase_client.py

      - name: 웹앱 재시작
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/rl.out -w '%{http_code}' -X POST \
                   -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}" \
                   "$PA_HOST/api/v0/user/$PA_USER/webapps/$PA_DOMAIN/reload/")
          if [ "$code" != "200" ]; then
            echo "::error::재시작 실패 (HTTP $code)"
            head -c 300 /tmp/rl.out; echo
            exit 1
          fi
          echo "재시작 완료"

      - name: 직원 화면이 실제로 뜨는지 확인
        run: |
          set -euo pipefail
          sleep 10
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                   "https://$PA_DOMAIN/${{ secrets.PA_SERVICE_PATH }}/")
          echo "직원 화면 응답: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::배포 후 화면이 정상(200)이 아닙니다: $CODE"
            exit 1
          fi
