<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>베어글스 근무표</title>
<style>
  /* 직원용 열람 페이지는 사이드바 없이 혼자 선다.
     base.html 을 상속하지 않으므로 색·버튼 토큰을 여기서 정의한다. */
  :root {
    --bg:#faf9f7; --card:#fff; --ink:#232320; --muted:#8a897f; --line:#e7e5de;
    --accent:#185fa5; --accent-bg:#e6f1fb;
    --warn:#854f0b; --warn-bg:#faeeda;
    --ok:#3b6d11; --ok-bg:#eaf3de;
    color-scheme: only light;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body {
    margin:0; background:var(--bg); color:var(--ink); line-height:1.6; font-size:15px;
    font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;
  }
  button { font-family:inherit; cursor:pointer; }
  button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tag { display:inline-block; font-size:12px; padding:3px 10px; border-radius:20px; vertical-align:middle; }
  .tag.warning { background:var(--warn-bg); color:var(--warn); }
  .tag.accent { background:var(--accent-bg); color:var(--accent); }
  .tag.success { background:var(--ok-bg); color:var(--ok); }
  .btn {
    display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--card);
    border-radius:8px; padding:9px 14px; font-size:14px; color:var(--ink); text-decoration:none;
  }
  .btn.primary { border-color:var(--accent); color:var(--accent); font-weight:700; }
  .note { background:var(--accent-bg); color:var(--accent); border-radius:8px; font-size:13px; padding:10px 14px; margin:14px 0; }
  .post { border:1px solid var(--line); border-radius:12px; background:var(--card); padding:16px; margin-bottom:14px; }
  .list { border:1px solid var(--line); border-radius:12px; background:var(--card); overflow:hidden; }
  .row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; flex-wrap:wrap; }
  .row:last-child { border-bottom:none; }
  .sec { margin:22px 0 10px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .sec b { font-size:16px; }
  .sec small { color:var(--muted); }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='schedule.css') }}">
</head>
<body>
<div class="pubwrap">
  <header class="pubbar">
    <span class="ico">🐻</span>
    <div><b>베어글스 근무표</b><br><small style="color:var(--muted);" id="sHeadState"></small></div>
  </header>

  <div id="sched">
    <div class="stabs">
      <button class="on" data-tab="stab-week" onclick="STAB('stab-week',this)">📅 스케줄</button>
      <button data-tab="stab-me" onclick="STAB('stab-me',this)">⭐ 내 근무</button>
      <button data-tab="stab-off" onclick="STAB('stab-off',this)">🙋 휴무 신청</button>
    </div>

    <section id="stab-week">
      <div style="display:flex;gap:6px;margin-bottom:12px;">
        <button class="btn chip on" id="svCal" onclick="SCHED.staffView('cal')">📅 캘린더</button>
        <button class="btn chip" id="svList" onclick="SCHED.staffView('list')">☰ 목록</button>
      </div>
      <div id="sWeekCal"></div>
      <div id="sWeekList" hidden></div>
      <div class="note">캘린더는 <b>옆으로 밀어</b> 볼 수 있어요. 내 근무는 진하게, 다른 사람은 흐리게 보여요.
        이 링크는 <b>스케줄만</b> 보여요 — 홈 화면에 추가해두면 앱처럼 쓸 수 있어요.</div>
    </section>

    <section id="stab-me" hidden>
      <div class="chiprow" id="mePicker"></div>
      <div style="font-size:12px;color:var(--muted);margin:0 0 12px;">처음 한 번만 자기 이름을 고르면 폰이 기억해요.</div>
      <div class="post nextshift" id="meNext"></div>
      <div class="sec"><b id="meTitle"></b><small>앞으로의 근무</small></div>
      <div class="list" id="meList"></div>
    </section>
    <section id="stab-off" hidden>
      <div class="chiprow" id="offWho"></div>
      <div class="cap" style="margin:0 0 12px;">누가 내는 신청인지 골라주세요. 폰이 기억해요.</div>

      <div class="post">
        <b id="offFormTitle">휴무 신청</b>
        <div class="cap" style="margin:4px 0 12px;">사장님이 보고 처리해요. 처리 전까지는 고치거나 취소할 수 있어요.</div>

        <label class="lbl" for="offFrom">언제부터</label>
        <div class="rowbar">
          <input class="fld num" type="date" id="offFrom" style="width:auto;">
          <span class="cap">~</span>
          <input class="fld num" type="date" id="offTo" style="width:auto;">
          <span class="cap" id="offDays"></span>
        </div>

        <div class="rowbar" style="margin-top:12px;">
          <button class="btn chip on" id="offAllDay" onclick="SCHED.offKind(true)">하루 종일</button>
          <button class="btn chip" id="offPart" onclick="SCHED.offKind(false)">시간만 빼기</button>
        </div>
        <div id="offTimeWrap" hidden style="margin-top:10px;">
          <label class="lbl">빼고 싶은 시간</label>
          <div class="rowbar">
            <span id="offStartWrap"></span>
            <span class="cap">~</span>
            <span id="offEndWrap"></span>
          </div>
        </div>

        <label class="lbl" for="offReason" style="margin-top:12px;">사유 <span style="color:var(--warn)">*</span></label>
        <input class="fld" type="text" id="offReason" maxlength="200"
               placeholder="예: 병원 예약 / 가족 행사" style="width:100%;">

        <div class="rowbar" style="margin-top:14px;">
          <button class="btn primary" id="offSubmit" onclick="SCHED.offSubmit()">신청하기</button>
          <button class="btn" id="offCancelEdit" hidden onclick="SCHED.offEditCancel()">수정 취소</button>
        </div>
        <div class="note" id="offMsg" hidden></div>
      </div>

      <div class="sec"><b id="offMineTitle">내가 낸 신청</b></div>
      <div id="offMine"></div>
    </section>

  </div>
</div>

<script>
  window.SCHED_BOOT = {{ boot | tojson }};
  window.SCHED_MODE = 'public';
  window.SCHED_TIMEOFF_POST = {{ staff_post | tojson }};
  function STAB(id, btn) {
    ['stab-week', 'stab-me', 'stab-off'].forEach(function (t) { document.getElementById(t).hidden = (t !== id); });
    if (id === 'stab-off' && window.SCHED) window.SCHED.offRender();
    btn.parentElement.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === btn); });
  }
</script>
<script src="{{ url_for('static', filename='schedule.js') }}"></script>
</body>
</html>
