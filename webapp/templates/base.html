<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>베어글스 블로그</title>
<style>
  :root { --bg:#faf9f7; --card:#fff; --ink:#232320; --muted:#8a897f; --line:#e7e5de;
          --accent:#185fa5; --accent-bg:#e6f1fb; --warn:#854f0b; --warn-bg:#faeeda;
          --ok:#3b6d11; --ok-bg:#eaf3de; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif; line-height:1.6; }
  .wrap { max-width:720px; margin:0 auto; padding:20px 16px 60px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .logo { width:38px; height:38px; border-radius:10px; background:var(--accent-bg); color:var(--accent);
          display:flex; align-items:center; justify-content:center; font-size:20px; }
  .brand b { font-size:16px; font-weight:600; } .brand small { display:block; color:var(--muted); font-size:12px; }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px;
         padding:9px 14px; font-size:14px; cursor:pointer; text-decoration:none; display:inline-flex;
         align-items:center; gap:5px; }
  .btn.primary { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
  .stat { background:#f1efe8; border-radius:8px; padding:14px; }
  .stat .n { font-size:24px; font-weight:600; } .stat .l { font-size:13px; color:var(--muted); margin-bottom:4px; }
  .sec { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .sec b { font-size:16px; font-weight:600; } .sec small { color:var(--muted); font-size:13px; }
  .list { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); }
  .row { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line);
         text-decoration:none; color:inherit; }
  .row:last-child { border-bottom:none; } .row:hover { background:#faf9f4; }
  .row .t { flex:1; min-width:0; }
  .row .t b { font-size:14px; font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .t small { color:var(--muted); font-size:12px; }
  .tag { font-size:12px; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .tag.warning { background:var(--warn-bg); color:var(--warn); }
  .tag.accent { background:var(--accent-bg); color:var(--accent); }
  .tag.success { background:var(--ok-bg); color:var(--ok); }
  .empty { text-align:center; color:var(--muted); padding:48px 16px; }
  .note { margin-top:16px; padding:12px 14px; background:var(--accent-bg); color:var(--accent);
          border-radius:8px; font-size:13px; }
  .post { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 24px; }
  .post pre { white-space:pre-wrap; word-break:break-word; font-family:inherit; font-size:15px; margin:0; }
  .back { color:var(--muted); text-decoration:none; font-size:14px; display:inline-block; margin-bottom:14px; }
  .nav { display:flex; gap:6px; margin-bottom:18px; }
  .nav a { font-size:14px; padding:7px 14px; border-radius:20px; text-decoration:none; color:var(--muted); }
  .nav a.on { background:var(--accent-bg); color:var(--accent); font-weight:600; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal .h { text-align:center; font-size:11px; color:var(--muted); padding-bottom:2px; }
  .cell { min-height:58px; border:1px solid var(--line); border-radius:6px; padding:4px; background:var(--card); }
  .cell.pad { background:transparent; border:none; }
  .cell.today { border:2px solid var(--accent); }
  .cell .d { font-size:11px; color:var(--muted); }
  .chip { font-size:10px; margin-top:2px; padding:1px 4px; border-radius:4px; display:block;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-decoration:none; }
  .chip.accent { background:var(--accent-bg); color:var(--accent); }
  .chip.success { background:var(--ok-bg); color:var(--ok); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a href="/plan" class="{{ 'on' if request.path.startswith('/plan') else '' }}">🧭 기획실</a>
      <a href="/" class="{{ 'on' if request.path == '/' else '' }}">📚 글 창고</a>
      <a href="/calendar" class="{{ 'on' if request.path.startswith('/calendar') else '' }}">📅 캘린더</a>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
