<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>베어글스 AI 비서</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#faf9f7; color:#232320; font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif; }
  .box { width:100%; max-width:340px; padding:28px 24px; background:#fff;
         border:1px solid #e7e5de; border-radius:14px; margin:16px; }
  .logo { width:46px; height:46px; border-radius:12px; background:#e6f1fb; color:#185fa5;
          display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:14px; }
  b { font-size:17px; } p { color:#8a897f; font-size:13px; margin:4px 0 20px; }
  input { width:100%; box-sizing:border-box; border:1px solid #e7e5de; border-radius:8px;
          padding:12px; font-size:16px; font-family:inherit; }
  button { width:100%; margin-top:12px; padding:12px; border:1px solid #185fa5; background:#185fa5;
           color:#fff; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;
           font-family:inherit; }
  .err { margin-top:12px; padding:10px 12px; background:#faeeda; color:#854f0b;
         border-radius:8px; font-size:13px; }
</style>
</head>
<body>
  <form class="box" method="post">
    <div class="logo">🐻</div>
    <b>베어글스 AI 비서</b>
    <p>비밀번호를 입력해주세요.</p>
    <input type="password" name="password" autofocus autocomplete="current-password"
           placeholder="비밀번호">
    <button type="submit">들어가기</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
